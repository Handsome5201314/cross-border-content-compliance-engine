em;line-height:1.7;overflow-wrap:anywhere\"><section><h3>hero<\/h3><section><h3>headline<\/h3><p>مساعد الذكاء الاصطناعي للأطباء المقيمين في طب الأطفال: توثيق سريري محلي بالكامل<\/p><\/section><section><h3>subtitle<\/h3><p>تحويل الصوت إلى نصوص، واستخراج تعليمات الاستشاري، وإنشاء مسودات السجلات الطبية داخل المستشفى دون اتصال بالإنترنت. حل برمجي متكامل مع بطاقة ذكية قابلة للارتداء (قيد التطوير).<\/p><\/section><section><h3>cta<\/h3><p>طلب عرض توضيحي للمؤسسات<\/p><\/section><\/section><section><h3>audiences<\/h3><ul><li><section><h3>buyer<\/h3><p>أقسام طب الأطفال في المستشفيات<\/p><\/section><section><h3>pain<\/h3><p>العبء الإداري الثقيل أثناء الجولات السريرية وصعوبة تتبع تعليمات الاستشاريين بدقة.<\/p><\/section><\/li><li><section><h3>buyer<\/h3><p>إدارات المشتريات العامة والموزعون الطبيون<\/p><\/section><section><h3>pain<\/h3><p>الحاجة إلى حلول تقنية تتوافق مع متطلبات سيادة البيانات المحلية وتقلل الاعتماد على البنية التحتية السحابية الخارجية.<\/p><\/section><\/li><\/ul><\/section><section><h3>solution<\/h3><p>نظام برمجيات مدمج يعمل محلياً على خوادم المستشفى (GPU) لتحويل زيارات الجناح والاستشارات إلى توثيق سريري منظم.مع الحفاظ على خصوصية بيانات المرضى عبر المعالجة المحلية داخل الشبكة المحلية.<\/p><\/section><section><h3>capabilities<\/h3><ul><li><section><h3>id<\/h3><p>SW-1<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>تحويل تسجيلات الجولات السريرية إلى نصوص وفصل المتحدثين (استشاري، طبيب مقيم، عائلة) لاستخراج تعليمات الاستشاري وأرشفتها حسب رقم السرير.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>SW-2<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>توجيه جمع التاريخ المرضي عند سرير المريض وإنشاء مسودات لسجل الدخول وملاحظات التقدم الأولى، مع وضع علامة «بحاجة إلى تأكيد» على الأجزاء غير الواضحة بدلاً من التخمين.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>SW-3<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>التعرف الضوئي على الحروف (OCR) لصور شاشة نظام معلومات المستشفى (HIS) أو ملفات PDF الممسوحة ضوئياً، وتحويلها إلى ملخصات مهيكلة لنتائج المختبر مع الإشارة إلى القيم غير الطبيعية وفقاً لنطاقات المرجع العمرية للأطفال.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>SW-4<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>توثيق جلسات التعليم السريري وحالات الأمراض المعقدة، وتخزينها في قاعدة معرفية قابلة للنمو لدعم التعلم المؤسسي.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>SW-5<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>مساعدة في متابعة المرضى عبر WeChat من خلال إنشاء قوائم أسئلة إضافية ومسودات ردود لأولياء الأمور، بانتظار موافقة الطبيب قبل الإرسال.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>SW-6<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>إدارة المهام اليومية عن طريق تجميع العناصر المعلقة (فجوات التوثيق، البنود التي تحتاج تأكيداً، مهام المتابعة) وإرسال تذكير يومي في الساعة 17:00.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>SW-7<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>إدارة المعرفة باستخدام تنسيق Markdown المتوافق مع Obsidian ونظام Git للإصدارات، مع نسخ احتياطي مشفر يومياً.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>HW-1<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم. ميكروفون عالي الجودة مدمج في بطاقة ذكية قابلة للارتداء مع اكتشاف النشاط الصوتي (VAD) للتسجيل التلقائي المقطع.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>HW-2<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم. رفع التسجيلات تلقائياً وربطها بسياق الوقت ورقم السرير لتوزيعها على سجلات المرضى المناسبة.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>HW-3<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم. تصوير شاشات HIS وأساور المعصم والباركودات بواسطة البطاقة الذكية، ومعالجتها عبر OCR محلي لهيكلة البيانات.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>HW-4<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم. ربط الأسوار والباركودات بأرقام الأسرة والمرضى لإضافة سياق تلقائي للتسجيلات والصور.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>HW-5<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم. شاشة حالة خفيفة الوزن وتنبيهات بالاهتزاز على البطاقة الذكية للإشعارات والمهام المعلقة.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>HW-6<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم. مراقبة مستمرة منخفضة الطاقة في وضع عدم الاتصال بالشبكة لضمان العمل أثناء انقطاع الإنترنت.<\/p><\/section><\/li><\/ul><\/section><section><h3>evidence<\/h3><ul><li><section><h3>claim<\/h3><p>فصل المتحدثين الدقيق أثناء الجولات السريرية<\/p><\/section><section><h3>source<\/h3><p>وثيقة متطلبات التفاعل للبطاقة الذكية v1؛ تقنية: Qwen3-ASR-1.7B مع pyannote<\/p><\/section><\/li><li><section><h3>claim<\/h3><p>إنشاء مسودات طبية دقيقة مع علامات للبيانات غير الواضحة<\/p><\/section><section><h3>source<\/h3><p>وثيقة متطلبات التفاعل للبطاقة الذكية v1؛ وكيل Hermes مع نموذج deepseek-v4-flash<\/p><\/section><\/li><li><section><h3>claim<\/h3><p>هيكلة نتائج المختبرات مع مراعاة الفئات العمرية للأطفال<\/p><\/section><section><h3>source<\/h3><p>وثيقة متطلبات التفاعل للبطاقة الذكية v1؛ خط أنابيب MinerU و PaddleOCR مع مراجعة بصرية محلية<\/p><\/section><\/li><li><section><h3>claim<\/h3><p>معالجة البيانات محلياً بنسبة 100% دون إرسال إلى السحابة<\/p><\/section><section><h3>source<\/h3><p>بنية النظام: معالجة ASR/OCR/الكتابة على وحدة معالجة رسومات RTX 3090 داخل المستشفى<\/p><\/section><\/li><\/ul><\/section><section><h3>compliance<\/h3><section><h3>data_sovereignty<\/h3><p>يعمل النظام بالكامل داخل بيئة المستشفى المحلية. تتم معالجة جميع بيانات المرضى، بما في ذلك التسجيلات الصوتية والصور، على أجهزة الخادم المحلية ويتم حذف الملفات الأصلية بعد المعالجة. لا يتم نقل أي بيانات إلى واجهات برمجة التطبيقات السحابية الخارجية. يهدف هذا التصميم إلى دعم متطلبات سيادة البيانات المحلية، لكن الامتثال النهائي للقوانين مثل GDPR أو لوائح حماية البيانات في السعودية والإمارات يخضع لتقييم قانوني مستقل لكل سوق.<\/p><\/section><section><h3>market_access<\/h3><p>المنتج موجه للمؤسسات الصحية وشركاء التوزيع. لا توجد ادعاءات بشأن شهادات تنظيمية محددة (مثل FDA أو CE أو SFDA) في هذه المرحلة. يجب على المشترين التحقق من متطلبات الاعتماد المحلي الخاصة بمناطقهم.<\/p><\/section><\/section><section><h3>faq<\/h3><ul><li><section><h3>topic<\/h3><p>deployment<\/p><\/section><section><h3>question<\/h3><p>كيف يتم نشر النظام في المستشفى؟<\/p><\/section><section><h3>answer<\/h3><p>يتم النشر محلياً على خوادم المستشفى المزودة بوحدات معالجة رسومات (مثل RTX 3090). لا يتطلب النظام اتصالاً دائماً بالإنترنت أو موارد سحابية خارجية، مما يسهل التكامل مع البنية التحتية الحالية.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>data<\/p><\/section><section><h3>question<\/h3><p>أين تتم معالجة بيانات المرضى؟<\/p><\/section><section><h3>answer<\/h3><p>تتم جميع عمليات المعالجة، بما في ذلك التعرف على الصوت والنصوص والصور، محلياً داخل شبكة المستشفى. لا تغادر بيانات المرضى الخوادم المحلية، ويتم حذف التسجيلات والصور الأصلية فور اكتمال المعالجة.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>certification<\/p><\/section><section><h3>question<\/h3><p>هل المنتج حاصل على شهادات طبية تنظيمية؟<\/p><\/section><section><h3>answer<\/h3><p>لا توجد حالياً شهادات تنظيمية مثل FDA أو CE معلن عنها. المنتج هو أداة مساعدة للتوثيق السريري ويتطلب مراجعة واعتماد الطبيب المسؤول قبل الاستخدام النهائي في السجلات الطبية.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>languages<\/p><\/section><section><h3>question<\/h3><p>ما هي اللغات المدعومة في النظام؟<\/p><\/section><section><h3>answer<\/h3><p>يدعم النظام اللغة العربية والإنجليزية ولغات أخرى حسب تكوين النموذج المحلي. تم تصميم نماذج التعرف على الصوت لمعالجة اللهجات والمصطلحات الطبية الشائعة في البيئات السريرية.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>training<\/p><\/section><section><h3>question<\/h3><p>هل يحتاج الأطباء إلى تدريب مكثف؟<\/p><\/section><section><h3>answer<\/h3><p>تم تصميم الواجهة لتكون بسيطة وتعتمد على الأوامر الصوتية الطبيعية. يوفر النظام توجيهاً أثناء جمع التاريخ المرضي، ولا يتطلب من الأطباء تعلم أوامر معقدة.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>support<\/p><\/section><section><h3>question<\/h3><p>كيف يتم تقديم الدعم الفني؟<\/p><\/section><section><h3>answer<\/h3><p>يتم تقديم الدعم الفني للشركاء المؤسساتيين والموزعين المعتمدين. يتضمن ذلك صيانة النماذج المحلية وتحديثات قاعدة المعرفة.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>price<\/p><\/section><section><h3>question<\/h3><p>ما هي تكلفة الاشتراك والعتاد؟<\/p><\/section><section><h3>answer<\/h3><p>نموذج التسعير يعتمد على اشتراك برمجي وتكلفة عتاد البطاقة الذكية (القيد التطوير). يرجى التواصل مع فريق المبيعات للحصول على عرض سعر مخصص يتناسب مع حجم المؤسسة.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>delivery<\/p><\/section><section><h3>question<\/h3><p>متى ستكون البطاقة الذكية متاحة؟<\/p><\/section><section><h3>answer<\/h3><p>البرمجيات متاحة حالياً للنشر المحلي. مكونات العتاد مثل البطاقة الذكية ذات الميكروفون والشاشة هي جزء من خارطة الطريق التطويرية وليست متاحة للتسليم الفوري.<\/p><\/section><\/li><\/ul><\/section><section><h3>cta<\/h3><section><h3>label<\/h3><p>جدول عرض توضيحي تقني<\/p><\/section><section><h3>next_step<\/h3><p>تواصل مع فريق المبيعات المؤسسيين لمناقشة متطلبات النشر المحلي وتجربة النظام البرمجي.<\/p><\/section><\/section><section><h3>seo<\/h3><section><h3>title<\/h3><p>مساعد الذكاء الاصطناعي لطب الأطفال: توثيق سريري محلي وآمن<\/p><\/section><section><h3>description<\/h3><p>حل برمجيات طبي يعمل محلياً لتحويل صوت الجولات إلى نصوص، وفصل المتحدثين، وإنشاء مسودات السجلات. يحافظ على سيادة البيانات داخل المستشفى.<\/p><\/section><section><h3>keywords<\/h3><ul><li><p>توثيق سريري للأطفال<\/p><\/li><li><p>ذكاء اصطناعي طبي محلي<\/p><\/li><li><p>تحويل الصوت إلى نص طبي<\/p><\/li><li><p>سيادة بيانات المستشفى<\/p><\/li><li><p>مساعد الطبيب المقيم<\/p><\/li><\/ul><\/section><\/section><section><h3>notices<\/h3><ul><li><p>مخرجات الذكاء الاصطناعي مسودات وتتطلب مراجعة الطبيب قبل الاستخدام.<\/p><\/li><\/ul><\/section><\/body><\/html>", "sec": 9}, {"title": "英文独立站 · delivery_site_medical_en.html", "doc": "<!doctype html><html lang=\"en\" dir=\"ltr\" data-page-node-id=\"aVVzvJnh0HwN1lfsWl0ZUI\"><meta charset=\"utf-8\" data-page-node-id=\"NVg6Z62G58iJE0G1lPxJ9A\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" data-page-node-id=\"YP2TdAZoj2OlCCGhadgmpC\"><body style=\"max-width:72ch;margin:auto;padding:1rem;line-height:1.7;overflow-wrap:anywhere\" data-page-node-id=\"Pfx01P0yoYWMnNHEKpItQI\"><section data-page-node-id=\"kZoQaKb47B2R6G3fOyvzJ7\"><h3 data-page-node-id=\"ivu8zq1OnBfgXrmNmeOKfr\">hero<\/h3><section data-page-node-id=\"FozHE4Tc0JcalidH2rwmHD\"><h3 data-page-node-id=\"Aw7Se0Sxr1ZAZPdElqHt8g\">headline<\/h3><p data-page-node-id=\"lKu9wh99i9c9YYireIJaGj\">Local-First Pediatric Clinical Documentation Assistant<\/p><\/section><section data-page-node-id=\"x0noFq1SwACxweIOTmt8HF\"><h3 data-page-node-id=\"hDJE7MUx2wKqr7obUywHTr\">subtitle<\/h3><p data-page-node-id=\"WY4UwEHfKreqUsI4J0M72j\">Automate ward round transcription, clinical note drafting, and lab result structuring. All data processed on-premise; no cloud transmission.<\/p><\/section><section data-page-node-id=\"wamk5avg6N7ZJd2v91fkOW\"><h3 data-page-node-id=\"FN9TKjI5kj6zlD1C7KDPKZ\">cta<\/h3><p data-page-node-id=\"iNd4o9egX9HdANnU7AAsxC\">Request Technical Briefing<\/p><\/section><\/section><section data-page-node-id=\"ILU7X9smRrf0xhTVcbCTno\"><h3 data-page-node-id=\"BEBLJIeWvwYcCsSr7QIGUV\">audiences<\/h3><ul data-page-node-id=\"uyhli5F7iyxpw7IYaNgGzc\"><li data-page-node-id=\"7sXgdVLcDIAQeMq3DLS89f\"><section data-page-node-id=\"lJ7vNE7LFX9G4oEOEKub7N\"><h3 data-page-node-id=\"1FKDXZS10A99PlgbmvWKls\">buyer<\/h3><p data-page-node-id=\"G5PTZuL6P7E9rc6FpellNf\">Hospital Pediatric Departments<\/p><\/section><section data-page-node-id=\"a2qOGEkKHjADpu9kQh9v9s\"><h3 data-page-node-id=\"1CEhIPgrRwHL1xFjXXHf7X\">pain<\/h3><p data-page-node-id=\"LGmS57vqR9WjreWJFXqCkk\">Manual documentation consumes resident time; risk of missing attending physician instructions during multi-speaker ward rounds.<\/p><\/section><\/li><li data-page-node-id=\"UoYyj9D76CKfPL10q8pdji\"><section data-page-node-id=\"EyP8EqTemZEx7h7gXXp7dj\"><h3 data-page-node-id=\"KcM9kkz5sihAizrA1vTiq1\">buyer<\/h3><p data-page-node-id=\"PEjHrZY7B6pN5Dz1lImllJ\">Medical Device Distributors<\/p><\/section><section data-page-node-id=\"MqjOKCjssTToLEjhLb709N\"><h3 data-page-node-id=\"AVxlD8nIZdpNI86t8C32w0\">pain<\/h3><p data-page-node-id=\"mQynTLqNeTlH1Ckb10c2wf\">Need for differentiated, compliant digital health solutions that do not require complex cloud integration or cross-border data transfer assessments.<\/p><\/section><\/li><li data-page-node-id=\"KukVEOcDAHP3ET1NKlgddy\"><section data-page-node-id=\"NqROXnlqGeyFJJYVatRnBo\"><h3 data-page-node-id=\"m9XGbRDaT4G5NxcrcXl2tD\">buyer<\/h3><p data-page-node-id=\"k2gnh1hpPGwM27guMlBc91\">Public Procurement Units<\/p><\/section><section data-page-node-id=\"ZrfHEIErXjCWxsF67TBYoL\"><h3 data-page-node-id=\"zOZl0jHxo7oX2u0ZOPLR2L\">pain<\/h3><p data-page-node-id=\"G7G9brTt95ZyC7TZDSuj8G\">Requirement for strict data sovereignty and local processing to meet national data protection regulations without relying on external cloud providers.<\/p><\/section><\/li><\/ul><\/section><section data-page-node-id=\"LYtfYCwlPxGF2ywa3vuAdA\"><h3 data-page-node-id=\"XGIkv8rBSGalFHoaM36J1p\">solution<\/h3><p data-page-node-id=\"yXLEPSOrUXj2jDqbApyhek\">An integrated software and hardware solution designed for pediatric residents. The software runs entirely on local hospital GPUs, handling automatic speech recognition, optical character recognition, and clinical documentation generation. A planned smart badge hardware component aims to automate audio capture and context association. The system ensures patient data remains within the hospital infrastructure, with raw recordings and images deleted after processing.<\/p><\/section><section data-page-node-id=\"ZWsfzlfe6dtbSoT0gghLZ6\"><h3 data-page-node-id=\"b7vjMQwzAEAcQVv2zm99A7\">capabilities<\/h3><ul data-page-node-id=\"wEgDc8CFrNptqbW6j4jKks\"><li data-page-node-id=\"J0VmWPHRj8Slxw9SkX3zDl\"><section data-page-node-id=\"qxnFklAClz5hL2fbRNBBVw\"><h3 data-page-node-id=\"ZO1R1Y4PTwpGJickHdpRdG\">id<\/h3><p data-page-node-id=\"1dyUJ1Xz1FPpD0gxu4kAej\">SW-1<\/p><\/section><section data-page-node-id=\"WNVj2YZqhWxBV16eRA7uR7\"><h3 data-page-node-id=\"RUrLL2uZahnVf71ZoE7TdK\">status<\/h3><p data-page-node-id=\"X6wHziKxToGqPssohxs8wo\">implemented<\/p><\/section><section data-page-node-id=\"YuMyjOGh6awKbGoDs4vViP\"><h3 data-page-node-id=\"JOmRoSzPWc4mvP8HoqChZV\">text<\/h3><p data-page-node-id=\"GHrVsKoAEzJbvJDaYNyLFl\">Transcribes ward round audio with speaker diarization to distinguish attending physicians, residents, and family members. Extracts and archives attending physician instructions by bed number.<\/p><\/section><\/li><li data-page-node-id=\"DFPum1HD4FuuUXD7L6nlaC\"><section data-page-node-id=\"6xeoIuefkCrhIqMqfb4L4F\"><h3 data-page-node-id=\"GCPXBY1ODZeZg9fblALe1H\">id<\/h3><p data-page-node-id=\"xqPxFDaehDcwm4XHyjNkBl\">SW-2<\/p><\/section><section data-page-node-id=\"oZErCWTD51OegeimWNXDri\"><h3 data-page-node-id=\"vfna9eUNOVbiyUno7NVBNV\">status<\/h3><p data-page-node-id=\"aOzPk5ugeMgpPHoBxiDwvo\">implemented<\/p><\/section><section data-page-node-id=\"PfW8OqGBfQsyfUYtGFj0J9\"><h3 data-page-node-id=\"pnuef8Z5RhujnC9QWJfBov\">text<\/h3><p data-page-node-id=\"SDcWMeBqpZBspNH4y9CyCY\">Guides bedside history taking and generates drafts for admission records and initial progress notes. Unclear audio segments are marked as &#x27;To Be Confirmed&#x27; rather than inferred.<\/p><\/section><\/li><li data-page-node-id=\"Y0e0jHdOfJUpujH3EC2mYw\"><section data-page-node-id=\"KBlpkfnWkJvAb1xB2gsAJT\"><h3 data-page-node-id=\"hy1lHB3AC8Vd6AbeOUn51r\">id<\/h3><p data-page-node-id=\"5OJQoLmh2QTNCqnLpNs5OW\">SW-3<\/p><\/section><section data-page-node-id=\"Ob0p6dhyFdGkc8CMOZ6ds9\"><h3 data-page-node-id=\"JPMwXDIDdb7q2PPgVnG6rP\">status<\/h3><p data-page-node-id=\"k4vevL8Mlc3p61itS37V9y\">implemented<\/p><\/section><section data-page-node-id=\"EsYfjoI8GiM3W1LE43dogg\"><h3 data-page-node-id=\"G9KHBDbu4ZgJ9D6kWKBGOn\">text<\/h3><p data-page-node-id=\"vfXCFZwqxC0rxvRztzFSFX\">Converts HIS screenshots or scanned PDFs into structured lab summaries using local OCR and visual verification. Flags abnormal values based on pediatric age-specific reference ranges.<\/p><\/section><\/li><li data-page-node-id=\"pKkuH14usBD31IgRKyPMSj\"><section data-page-node-id=\"54jIDuS8T3H7aCqeE82odU\"><h3 data-page-node-id=\"AqzW9VusLoaXIjKv3HJ3Hz\">id<\/h3><p data-page-node-id=\"bzC5CYxS5fg9yqT8lDbfnL\">SW-4<\/p><\/section><section data-page-node-id=\"jzlG9vXwA3i1SV5Dm5I9iG\"><h3 data-page-node-id=\"spoFmlWEAy9P42wRG6GHRd\">status<\/h3><p data-page-node-id=\"sFqC1Brps8ngxzKkr3eZrJ\">implemented<\/p><\/section><section data-page-node-id=\"I9EMZQQovSGEBPC0w200KA\"><h3 data-page-node-id=\"uvxlfcrjFpTyexrZcsKnoh\">text<\/h3><p data-page-node-id=\"dTJofbl0INuFz10sxGOpJY\">Generates complete records for teaching rounds and difficult case discussions, contributing to a growing disease-specific knowledge base.<\/p><\/section><\/li><li data-page-node-id=\"FSJPAaRtnfCseAFkrnvG9g\"><section data-page-node-id=\"Um0LLVEXoHH2aRV8uxwdaA\"><h3 data-page-node-id=\"TTsk9t49kMiTJlpvC0P2sz\">id<\/h3><p data-page-node-id=\"mGurbiToLhWhoOAthwUXvn\">SW-5<\/p><\/section><section data-page-node-id=\"cEnDRkjBciqVdSWHcepn4c\"><h3 data-page-node-id=\"Nc8SCCDNYl2zIh6ahR64eD\">status<\/h3><p data-page-node-id=\"UZdjvLJ0O8lFrxvXKgFe5p\">implemented<\/p><\/section><section data-page-node-id=\"Odb2TH2XJlpNi6RYMsLrvr\"><h3 data-page-node-id=\"v1E7Gbi877UMr1ZGG74scQ\">text<\/h3><p data-page-node-id=\"NtySyjSXshSNnXd1l2VSe7\">Assists with WeChat follow-ups by generating supplementary question lists and reply drafts for parental messages, subject to physician confirmation before sending.<\/p><\/section><\/li><li data-page-node-id=\"VUWFSZBIaNJJNwVHbl3MkT\"><section data-page-node-id=\"RBepqeSBNOhRq3BNMzWalf\"><h3 data-page-node-id=\"easDSSJXze0Qc1ALCuYZqR\">id<\/h3><p data-page-node-id=\"5V0KZcRGfAo2XmiPSRJke8\">SW-6<\/p><\/section><section data-page-node-id=\"1rXHbEUgpKjIjTmQLB56jg\"><h3 data-page-node-id=\"d2HtxWUk2A0WOgDmiglKP9\">status<\/h3><p data-page-node-id=\"3uJ8wUhs8t0D2Z5sM1g0RP\">implemented<\/p><\/section><section data-page-node-id=\"4ucmqi16HjwgsGYLsVt3Nj\"><h3 data-page-node-id=\"uHYMh7fVg5yc70rNWFoGAc\">text<\/h3><p data-page-node-id=\"jANPPZtOGbGlM3hjxmQR7Y\">Aggregates daily tasks including documentation gaps, items requiring confirmation, and follow-up duties, with a push notification scheduled for 17:00 daily.<\/p><\/section><\/li><li data-page-node-id=\"dRCB9fS5v7Ng9hYtqAaMmV\"><section data-page-node-id=\"wHTy56sJaeCSMENigEORC7\"><h3 data-page-node-id=\"PIZTah5U36lfwBKIdoDu6R\">id<\/h3><p data-page-node-id=\"RUFN0kliXcXK1eAlI84NT7\">SW-7<\/p><\/section><section data-page-node-id=\"PNOTcGgq9xKi8SAsNfYaRZ\"><h3 data-page-node-id=\"2vL5BHXZukkjX7tnXyzHBI\">status<\/h3><p data-page-node-id=\"JC5ABYJBeD2ODJYCPRiGvQ\">implemented<\/p><\/section><section data-page-node-id=\"qYNqoMrVHOMQn4is5pE1Uo\"><h3 data-page-node-id=\"NXGnaZT3MzE3Z4Avw96aj7\">text<\/h3><p data-page-node-id=\"0vL3UK8V1FqKjsIKsUmgf9\">Manages all records and knowledge in Obsidian-compatible markdown format with git version control and daily encrypted backups.<\/p><\/section><\/li><li data-page-node-id=\"qyFWtC1pZFxdE5AOIjrKIH\"><section data-page-node-id=\"PYTerASWUUzXaOInKvS0aD\"><h3 data-page-node-id=\"WDTApBHGOD6llmZPx5dato\">id<\/h3><p data-page-node-id=\"hBeYG9ymeimmyoZ9SRwOHS\">HW-1<\/p><\/section><section data-page-node-id=\"qhAitDGCQkGcQ3uhPAeaAK\"><h3 data-page-node-id=\"3SQMyCiLJtFlBjNDWBAU5x\">status<\/h3><p data-page-node-id=\"AbVQHgV0SVQChX7QQqir0M\">planned<\/p><\/section><section data-page-node-id=\"MyBlYzby5uyZyPxKfgGYe6\"><h3 data-page-node-id=\"RIR41PFlmcjxt3zBFo80PN\">text<\/h3><p data-page-node-id=\"IV1jgXRz6GFKHDdh69D3bg\">Roadmap — planned, not available for demonstration or delivery. Wearable high-quality microphone with Voice Activity Detection (VAD) for automatic segmented recording, replacing manual operation.<\/p><\/section><\/li><li data-page-node-id=\"zsv5pLGWQDdW2d9WcdHznX\"><section data-page-node-id=\"sKkBQArBsPVFbLaJHGvCSA\"><h3 data-page-node-id=\"0enKO08dfIP3cdlAVYWeba\">id<\/h3><p data-page-node-id=\"QmVac8Q17eBR2DgOPfBndJ\">HW-2<\/p><\/section><section data-page-node-id=\"ByCHHYkE7xaTUsSFT1CtiC\"><h3 data-page-node-id=\"3Bg0GiDibL8quLg4yqtc1p\">status<\/h3><p data-page-node-id=\"k68fijpc9VpJHiiOFLEHQn\">planned<\/p><\/section><section data-page-node-id=\"E2OasArJ6F6eAiystogQ7H\"><h3 data-page-node-id=\"tdnj8qafuuuvp0epzK1KgC\">text<\/h3><p data-page-node-id=\"aeumN19qhpPkJSNoXt8vpy\">Roadmap — planned, not available for demonstration or delivery. Automatic upload of recordings with distribution to corresponding patient records based on time and bed context.<\/p><\/section><\/li><li data-page-node-id=\"OIt8j0XORlF2b9Xe2y6p8D\"><section data-page-node-id=\"q2opUk6InegNuL9o2MwFXB\"><h3 data-page-node-id=\"bfcz3BRkIVbUFjAARJalc7\">id<\/h3><p data-page-node-id=\"LU1Xrg65OGFhdOTcenD2zc\">HW-3<\/p><\/section><section data-page-node-id=\"xo1evBchC97pESjcQGss2W\"><h3 data-page-node-id=\"PYH6HGheVPYXY2NcW57OyS\">status<\/h3><p data-page-node-id=\"eQ6SWZ9apJpDeBMDzFpLH2\">planned<\/p><\/section><section data-page-node-id=\"j8a33EenHshYDvQgZtyT4h\"><h3 data-page-node-id=\"liqmupiEdGV6BxEBqnDZNY\">text<\/h3><p data-page-node-id=\"xYbR8gD1S9UMPiMhWPL1tW\">Roadmap — planned, not available for demonstration or delivery. Optical Character Recognition for HIS screens, patient wristbands, and barcodes via badge camera, processed locally.<\/p><\/section><\/li><li data-page-node-id=\"iL6ssdCBOCWNswk4Cp8k2M\"><section data-page-node-id=\"icQ8EZ6s3oGUI0fmqLHFXF\"><h3 data-page-node-id=\"ZTgO1DBavq4Z9811uPNm2i\">id<\/h3><p data-page-node-id=\"qb7avn9DzRen9yknuCCwwp\">HW-4<\/p><\/section><section data-page-node-id=\"DyfXCrrqrdrSVXJ6eyBDKh\"><h3 data-page-node-id=\"d5lOE80yUdhPrOnTCrx1ak\">status<\/h3><p data-page-node-id=\"Tl73TuMHsYfFEMC5xGLzcM\">planned<\/p><\/section><section data-page-node-id=\"FRG0CpsD1TWPm6WvXauAt4\"><h3 data-page-node-id=\"upzPvlUkfj3qO06CAAqwVu\">text<\/h3><p data-page-node-id=\"EMh3wimNJoBig1YHuJPk4b\">Roadmap — planned, not available for demonstration or delivery. Association of beds and patients via wristband or barcode scanning to automatically attach context to recordings and photos.<\/p><\/section><\/li><li data-page-node-id=\"aYQGo3bdJ6Z5wuCPDaG9di\"><section data-page-node-id=\"WWHBDdn1mXw9ESQOfVoz0v\"><h3 data-page-node-id=\"WRhstdptCYkDSjMaJtC6UW\">id<\/h3><p data-page-node-id=\"2FnGZyExof1jzEBGzYSoAi\">HW-5<\/p><\/section><section data-page-node-id=\"iqUK6W36HyNCHnjs2D28Su\"><h3 data-page-node-id=\"0ZpOE3uDrZABBrd0L7EUkd\">status<\/h3><p data-page-node-id=\"KvGHtkqPPt0u13CCRm2dEJ\">planned<\/p><\/section><section data-page-node-id=\"BBgu2Cmpi7Mdorhs6FlQWM\"><h3 data-page-node-id=\"UNnnX9ElGAlxHuX8A3cItH\">text<\/h3><p data-page-node-id=\"hcYJuCryY8VL5tYFpHUAcG\">Roadmap — planned, not available for demonstration or delivery. Lightweight status screen and vibration alerts for task notifications and push messages.<\/p><\/section><\/li><li data-page-node-id=\"guwel7067Ms1OELqLKsUYq\"><section data-page-node-id=\"cnlJnFYJtLnsCey2Ap8vZM\"><h3 data-page-node-id=\"lcI8NbuoObYvcmtyOI5XfA\">id<\/h3><p data-page-node-id=\"QEgc364WbqmsuBL9KS85xS\">HW-6<\/p><\/section><section data-page-node-id=\"dI58yZAPMBRRfFAm4mkbZU\"><h3 data-page-node-id=\"77xyR9WwAj3CivGRnk1mK9\">status<\/h3><p data-page-node-id=\"pYPYr7TpkjZd3hAHCJoPIM\">planned<\/p><\/section><section data-page-node-id=\"KhmXWZQoXQcwHo2BhuXZBI\"><h3 data-page-node-id=\"a39ZhZxBZJKpTRzGLNGq1l\">text<\/h3><p data-page-node-id=\"jg3CnnT5QceusEdNGNniVk\">Roadmap — planned, not available for demonstration or delivery. Low-power continuous listening capability for offline hospital scenarios, ensuring functionality during network interruptions.<\/p><\/section><\/li><\/ul><\/section><section data-page-node-id=\"bM39FFwCZgV4QFUqTuBQPN\"><h3 data-page-node-id=\"EGphIiDmRCVm4iorzgS3jM\">evidence<\/h3><ul data-page-node-id=\"fz7g5amEoKrOOGqRCDIwZg\"><li data-page-node-id=\"amyOC9aLsqelNNyHo4BqzC\"><section data-page-node-id=\"9B68yTUUCsrUqU5F123kYZ\"><h3 data-page-node-id=\"81cUOrLgLpmKmqaBswBI9Y\">claim<\/h3><p data-page-node-id=\"2txaeVmlNtpm9NRZYbFlrE\">Speaker diarization distinguishes attending physicians from residents and family members during ward rounds.<\/p><\/section><section data-page-node-id=\"FaoLrcw2iH36J62Rd7Tdna\"><h3 data-page-node-id=\"lyCI1iuInLQR7KCHWK78qX\">source<\/h3><p data-page-node-id=\"uYKsRBaFR4UN8uswcRMpH3\">Smart Badge Interaction Requirements Specification v1; Tech stack: Qwen3-ASR-1.7B + pyannote<\/p><\/section><\/li><li data-page-node-id=\"yFwBmLsBpqZcq0V215yjWC\"><section data-page-node-id=\"XRB9SjP6zjYMWukDGluCty\"><h3 data-page-node-id=\"0Ega3biZifFE564oQwvpYw\">claim<\/h3><p data-page-node-id=\"KPD4QwDjrwmlo6c9UslJaB\">Clinical documentation drafts are generated using hospital-specific pediatric templates and require physician review.<\/p><\/section><section data-page-node-id=\"VDCtqzvDBqrHTfYUpg3Q5A\"><h3 data-page-node-id=\"LPGPVXz0J3ILXiYg2jvVgr\">source<\/h3><p data-page-node-id=\"Gny5gUG0ROMaauC7JbhF9l\">Smart Badge Interaction Requirements Specification v1; Tech stack: Hermes agent (deepseek-v4-flash)<\/p><\/section><\/li><li data-page-node-id=\"81eFNVGfJrXCmEmTlynJbC\"><section data-page-node-id=\"K46UW2MbZrh7NFYOvhnTf9\"><h3 data-page-node-id=\"CUjelOlelznHJdzNMhDG8P\">claim<\/h3><p data-page-node-id=\"bFi5rtU71ssBQUJTuoSuj2\">Lab results are structured from images with visual model verification and age-specific reference range annotation.<\/p><\/section><section data-page-node-id=\"ZGF5zlADIy6DpnMCGEvBTR\"><h3 data-page-node-id=\"8VlqIQphsXVDmwFkL5AzW2\">source<\/h3><p data-page-node-id=\"j1QDQJQkUxF6KB3UxqJDeM\">Smart Badge Interaction Requirements Specification v1; Tech stack: MinerU + PaddleOCR + qwen3.8:27b<\/p><\/section><\/li><li data-page-node-id=\"nC0vrxtVBB2pmwwct70Zub\"><section data-page-node-id=\"Xcm8ii7tYPHXBHbxNJQAa1\"><h3 data-page-node-id=\"HOEPYbKfuE50BzwCjst2MD\">claim<\/h3><p data-page-node-id=\"r8ymYATvcfQdcHjaMPnSrd\">Knowledge base uses Obsidian-compatible markdown with git versioning and daily encrypted backups.<\/p><\/section><section data-page-node-id=\"tichOYK994DqQycG6JGSlB\"><h3 data-page-node-id=\"mmo5geDl75CDXoUIatJEbn\">source<\/h3><p data-page-node-id=\"nuJxAmKAwYqHnkl67AncsE\">Project MEMORY.md: Knowledge Base Architecture<\/p><\/section><\/li><\/ul><\/section><section data-page-node-id=\"sVFhhijVLZChY63i0HvOyu\"><h3 data-page-node-id=\"4sFMsx5BeYXNwhRTGiNiz1\">compliance<\/h3><section data-page-node-id=\"96rgXmnGKZ3PkV7Nvv3VAJ\"><h3 data-page-node-id=\"BBDNLGPZlBgDTDiO1JZ8xW\">data_sovereignty<\/h3><p data-page-node-id=\"jWRODqfrrFZKP0UZtKyGqF\">All data processing, including OCR, visual verification, transcription, and de-identification, occurs on local hospital GPUs (RTX 3090 24GB). No patient data is transmitted to cloud APIs. Raw audio and images are deleted immediately after processing. This design supports data localization requirements, but specific regulatory compliance (such as GDPR, Indonesia PDPA, or Saudi/UAE data laws) must be verified by the purchasing institution according to local jurisdiction.<\/p><\/section><section data-page-node-id=\"hu731kn9O57gWakFLAhUqM\"><h3 data-page-node-id=\"HIYBAoB2DACRB8YtAFE0nZ\">market_access<\/h3><p data-page-node-id=\"d7itIDKu2RIVJFJCi0ELe8\">This product is a software tool and hardware prototype intended for professional use within hospital environments. It does not carry medical device certifications such as FDA, CE, or SFDA. Compliance with local medical device regulations is the responsibility of the deploying institution. Cross-border data transfer assessments are not required for the software&#x27;s operation as no data leaves the local premises, but legal obligations for the institution must be assessed separately.<\/p><\/section><\/section><section data-page-node-id=\"JCPI6WcOiPkdPYxS5QYkCm\"><h3 data-page-node-id=\"F6HNCnwdkYOF9U0Gxf1DuA\">faq<\/h3><ul data-page-node-id=\"cxDFQE7MSBI7i7wadeC322\"><li data-page-node-id=\"kXQMjSVVhequjEFpCCD43X\"><section data-page-node-id=\"cZ9kuEDFEGGATrsueIbpxo\"><h3 data-page-node-id=\"0TGHwtD3HNHw4JbEBLfJ57\">topic<\/h3><p data-page-node-id=\"utS66zuTmYxc4txPrhEgeM\">deployment<\/p><\/section><section data-page-node-id=\"qixnECPKAP5wVxQ5uhUbm5\"><h3 data-page-node-id=\"0A6bGoYIFGiCTQCnjvtYrf\">question<\/h3><p data-page-node-id=\"thAqknaDfEkI2suVfRSHWf\">What are the hardware requirements for deployment?<\/p><\/section><section data-page-node-id=\"qMnu5JUwrnCnppm37sUDFt\"><h3 data-page-node-id=\"dfpW5i67MkGHyd5jQw2AGl\">answer<\/h3><p data-page-node-id=\"bjNcv2esd0Y2G1Z1914Qlv\">The software runs on a local server equipped with an RTX 3090 24GB GPU. It handles ASR, OCR, visual verification, and transcription locally. No cloud resources or external IT integration are required for the core functionality.<\/p><\/section><\/li><li data-page-node-id=\"oyojVSLrXn6w695YMF19i0\"><section data-page-node-id=\"ZGyRMUKFrLtEJZQh3B3wf9\"><h3 data-page-node-id=\"dRtXf9XLv3LVwsHpWK9g26\">topic<\/h3><p data-page-node-id=\"7DrSZNofbaEoWEYQsaMbve\">data<\/p><\/section><section data-page-node-id=\"11woMqrak9HARlGh7bnThI\"><h3 data-page-node-id=\"oEDgx4AQiMcha2UuBkLt4H\">question<\/h3><p data-page-node-id=\"c8arz0dHlwzv7f5zytik8L\">Is patient data sent to the cloud?<\/p><\/section><section data-page-node-id=\"D1SsxnjngJo1pK9jjodrvU\"><h3 data-page-node-id=\"GsghPMst9cvKFHjtVEYWTD\">answer<\/h3><p data-page-node-id=\"U1v8HXyHcXvPYDwYUHK27N\">No. All data processing is performed on-premise. Patient data never leaves the hospital&#x27;s local infrastructure. Raw recordings and images are deleted immediately after processing to minimize data retention.<\/p><\/section><\/li><li data-page-node-id=\"qYD6R73epnlirNGSd4h3ZP\"><section data-page-node-id=\"ucqxCMGIgfwJyhdR26qz9b\"><h3 data-page-node-id=\"in9gUQBcJoU9CUXp5tePPZ\">topic<\/h3><p data-page-node-id=\"obI070iXgxaGIzcCeRpiGL\">certification<\/p><\/section><section data-page-node-id=\"j1PfhW9qAnxPWGfYXhuFX3\"><h3 data-page-node-id=\"BMlZgBDe4DIsMx8obDsgi9\">question<\/h3><p data-page-node-id=\"XK3OHQDIXYg5KsLymZtjwk\">Does this product have FDA or CE certification?<\/p><\/section><section data-page-node-id=\"Spsr3DgjnVpyXWpRW3ooge\"><h3 data-page-node-id=\"ZuQuieg5kV6LXdvtwX5xYN\">answer<\/h3><p data-page-node-id=\"ydBRwIf6O6TCWUWHXoYS6d\">No. This product is currently a research and development project deployed in partner hospitals. It does not hold FDA, CE, or other medical device certifications. It is intended as a clinical documentation aid, and all outputs require physician review.<\/p><\/section><\/li><li data-page-node-id=\"PBWG4YyQ0lCAfF6GOnnLrW\"><section data-page-node-id=\"C0L5FM4zvbrwXF1nAoS6qk\"><h3 data-page-node-id=\"QSLggUNfb6wJDDi7TSFy8S\">topic<\/h3><p data-page-node-id=\"2VwNtlAI440HncgrdSWjuT\">languages<\/p><\/section><section data-page-node-id=\"jEwTm8eGMRaI5EVU28wPOh\"><h3 data-page-node-id=\"5RwH66uDLRzikqkOpG2r6V\">question<\/h3><p data-page-node-id=\"YzLZc74lRr8CAyymUgqYOT\">Which languages are supported for transcription and documentation?<\/p><\/section><section data-page-node-id=\"kVdhIE0NlbQtRRnK1iHA5R\"><h3 data-page-node-id=\"GnEvleHvLqBastpFzdziBu\">answer<\/h3><p data-page-node-id=\"KvkmsRkU0PgNQEhSwCaGPJ\">The system is optimized for clinical English and Chinese contexts as per current deployment. Support for other languages depends on the underlying ASR and LLM models configured for the specific hospital environment.<\/p><\/section><\/li><li data-page-node-id=\"5oOATVW61wguIUhFtOIpiU\"><section data-page-node-id=\"cvtjHc21ks4c6MTuK72jyi\"><h3 data-page-node-id=\"EISAUfRCQQkCX2P61M5Lkd\">topic<\/h3><p data-page-node-id=\"VTB9Dl3WmpnqQuVhlF073I\">training<\/p><\/section><section data-page-node-id=\"YE0kkHhjibWeu1vGRJtmnS\"><h3 data-page-node-id=\"B3WoAW7sUoJIk1qsvNbWOy\">question<\/h3><p data-page-node-id=\"NfzPscn1p2FMfkhLjSS3iG\">How much training is required for residents?<\/p><\/section><section data-page-node-id=\"cQu1sDtnRVkbhyzGPyXiAP\"><h3 data-page-node-id=\"ecbdWfPFWVhzVLsuPW4vrl\">answer<\/h3><p data-page-node-id=\"cUtqlxoPquNsnGq5hPstSE\">The software is designed for minimal interaction. Residents wear the badge (when available) or use the software interface for specific tasks like lab OCR. Training focuses on reviewing AI-generated drafts and confirming unclear items.<\/p><\/section><\/li><li data-page-node-id=\"g0PKRh8jDZKdugDVozXmdO\"><section data-page-node-id=\"pMmrI1AT22i281j2BBrsqN\"><h3 data-page-node-id=\"ACP3bfG08Nm8Ka6X9jSx8z\">topic<\/h3><p data-page-node-id=\"kQW2XFb3AkhrSiI3IFRNAB\">support<\/p><\/section><section data-page-node-id=\"sXTU54zSbDp0XyELtvbjdf\"><h3 data-page-node-id=\"aKTHyDgo9WXR7XyBdWtWE2\">question<\/h3><p data-page-node-id=\"ADNhUDBE1qTqQIM90pdwUm\">What technical support is provided?<\/p><\/section><section data-page-node-id=\"DINAz0uwRAB864deeiWafg\"><h3 data-page-node-id=\"YqPGnjAev8k1QScZTKz7Fz\">answer<\/h3><p data-page-node-id=\"Dvk7TWk8t6RzAi7FdLOYxU\">Support includes initial setup assistance and maintenance of the local server environment. Updates to the knowledge base and models are managed through the local git repository and encrypted backup systems.<\/p><\/section><\/li><li data-page-node-id=\"gHUJ6kZunGEB9tSuTwwQBX\"><section data-page-node-id=\"yUcMXD9xsxua2uSH0s2lgV\"><h3 data-page-node-id=\"8tzk1G1r3SNAapW0qmM2Di\">topic<\/h3><p data-page-node-id=\"CCvq7pkDJscboULDAvpiOO\">price<\/p><\/section><section data-page-node-id=\"mAjtqbdHwpfhVrC3BNPiF7\"><h3 data-page-node-id=\"2B0giilh5opSLfVlW7eXkT\">question<\/h3><p data-page-node-id=\"VISxrOb5o3bAT0JEhjzjQD\">What is the pricing model?<\/p><\/section><section data-page-node-id=\"4EBmiHOQAqaBvZYc5GW7u1\"><h3 data-page-node-id=\"oKpVMByc4lq4ZvaN1dXfmr\">answer<\/h3><p data-page-node-id=\"gVYKKFNoJLolWYEtBRhDxn\">Pricing is determined on a case-by-case basis for hospital and distributor partnerships. Specific costs for software subscription and hardware units are not publicly listed and must be discussed directly with the sales team.<\/p><\/section><\/li><li data-page-node-id=\"g3Jeod4otS8YJxGbJtVF7J\"><section data-page-node-id=\"BlCUNj5Sa4cKdTFCR4JEOB\"><h3 data-page-node-id=\"CqMHqlUCeP2BkLmwPVgOef\">topic<\/h3><p data-page-node-id=\"O4TvjxjC0bAu1inCQ8T6sA\">delivery<\/p><\/section><section data-page-node-id=\"WylUZSnH8iuFb0SwjCvTeh\"><h3 data-page-node-id=\"Cxji6TiYF1DRmJS52zsA8y\">question<\/h3><p data-page-node-id=\"5pE5w0JnP8dvKNImbeiWrr\">What is the delivery timeline for the smart badge hardware?<\/p><\/section><section data-page-node-id=\"n2kcezGTEjCqvRyUO0jQDF\"><h3 data-page-node-id=\"iHjrGl3eXTzxsYNsBF5WCe\">answer<\/h3><p data-page-node-id=\"XcS6QSpXM0GsqP0kSThun4\">The smart badge hardware features are currently in the planning phase and are not available for immediate delivery or demonstration. Only the software components are currently implemented and deployable.<\/p><\/section><\/li><\/ul><\/section><section data-page-node-id=\"ZbZodxoW2Gn2aCXepciqe7\"><h3 data-page-node-id=\"2APE7iBSsJDBrRh14ymsIi\">cta<\/h3><section data-page-node-id=\"S3AteVUS9Py35JbkVhFzD7\"><h3 data-page-node-id=\"PwvueMCNELusFJpBmJJoBZ\">label<\/h3><p data-page-node-id=\"okNGjmim4kF7XujPtD35zb\">Schedule a Technical Demo<\/p><\/section><section data-page-node-id=\"ERXt61YS44PksSHweXlmXx\"><h3 data-page-node-id=\"GHZgVIitqTSrO7EdUZRAOL\">next_step<\/h3><p data-page-node-id=\"GP2aAKs8b4gAYxdL7bWe67\">Contact our team to arrange a secure, on-premise demonstration of the software capabilities. Hardware features are not included in current demos.<\/p><\/section><\/section><section data-page-node-id=\"V1BskiOURkBusSlnE44ia9\"><h3 data-page-node-id=\"GqiLq8hAWPJ1lePBqq5YxF\">seo<\/h3><section data-page-node-id=\"pCiHQJ7oD81X5jhsIAdXBP\"><h3 data-page-node-id=\"rb8bTdVgT8vDkBWCCBw2jR\">title<\/h3><p data-page-node-id=\"MsXycEMeTECdVIRssrQSd7\">Local-First Pediatric AI Assistant for Hospitals<\/p><\/section><section data-page-node-id=\"NVyupjfwHniYtZTtnVdmU4\"><h3 data-page-node-id=\"czZ3tRDz2FozM3BVCr5bIJ\">description<\/h3><p data-page-node-id=\"BTuPEL05XPfxFziSNlRPre\">Automate clinical documentation with on-premise AI. Secure, local processing for ward rounds, lab OCR, and note drafting. No cloud data transfer.<\/p><\/section><section data-page-node-id=\"eHxM0EWOcp49JR6jChLIwS\"><h3 data-page-node-id=\"IqjLaUXJC6GZ6poYT28wGq\">keywords<\/h3><ul data-page-node-id=\"qPbGPENrEvnLiPdTcbPSrM\"><li data-page-node-id=\"c8FnkbNQJYpGh3pPCKMS6E\"><p data-page-node-id=\"JYy8qU9HkGCWvogdPfARRj\">pediatric clinical documentation<\/p><\/li><li data-page-node-id=\"e4cgbSbnHI8RVgFqc1K3rH\"><p data-page-node-id=\"RLpdWKFFgVkksLRZycVdCp\">local AI healthcare<\/p><\/li><li data-page-node-id=\"MjgCEmSuA2GpyEXBDzxDR2\"><p data-page-node-id=\"QUWLBihCXKB3AxRCH9GVGM\">ward round transcription<\/p><\/li><li data-page-node-id=\"qXUdtooCifEibR78eH7PRm\"><p data-page-node-id=\"U8xFMjluYqrMOKH4npCkSs\">hospital data sovereignty<\/p><\/li><li data-page-node-id=\"42ai6G1uU5z670mTLyEvne\"><p data-page-node-id=\"BVrZ8pJsABoDeuQ2tYlRB3\">clinical note automation<\/p><\/li><\/ul><\/section><\/section><section data-page-node-id=\"ceAYDfGC6Hhbc5JaAv2OFn\"><h3 data-page-node-id=\"Bur1mCaF3sTULbYB21CTh6\">notices<\/h3><ul data-page-node-id=\"q6uRhdRWBBGRrjLQYuaeBp\"><li data-page-node-id=\"EOMMnRhNaJ9qkrafHf0UZ4\"><p data-page-node-id=\"YujHVWBeRlU6nYgHsEEilx\">AI outputs are drafts and require physician review before use.<\/p><\/li><\/ul><\/section><\/body><\/html>", "sec": 7}, {"title": "消费品对照（换一份 JSON，不改代码）· delivery_site_consumer_en.html", "doc": "<!doctype html><html lang=\"en\" dir=\"ltr\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><body style=\"max-width:72ch;margin:auto;padding:1rem;line-height:1.7;overflow-wrap:anywhere\"><section><h3>hero<\/h3><section><h3>headline<\/h3><p>Reliable 600W Portable Power for Outdoor and Emergency Use<\/p><\/section><section><h3>subtitle<\/h3><p>Pure sine wave output with LiFePO4 battery technology. Supports solar charging for sustainable energy access in Southeast Asia and the Middle East.<\/p><\/section><section><h3>cta<\/h3><p>Request Product Specifications<\/p><\/section><\/section><section><h3>audiences<\/h3><ul><li><section><h3>buyer<\/h3><p>Households in regions with unstable grid power<\/p><\/section><section><h3>pain<\/h3><p>Need for dependable backup power during outages caused by weather or infrastructure issues.<\/p><\/section><\/li><li><section><h3>buyer<\/h3><p>Outdoor enthusiasts and campers<\/p><\/section><section><h3>pain<\/h3><p>Requirement for portable, quiet power sources for lighting, cooking, and device charging off-grid.<\/p><\/section><\/li><li><section><h3>buyer<\/h3><p>Mobile micro-merchants and street vendors<\/p><\/section><section><h3>pain<\/h3><p>Need for consistent electricity to operate small appliances and digital payment terminals at night markets.<\/p><\/section><\/li><\/ul><\/section><section><h3>solution<\/h3><p>The DEMO-BRAND 600W Portable Power Station provides a versatile energy solution designed for mobility and resilience. It features a robust LiFePO4 battery core and pure sine wave inverter, ensuring compatibility with sensitive electronics. With multi-port output and solar input capability, it serves as a flexible power hub for emergency preparedness, outdoor recreation, and mobile business operations.<\/p><\/section><section><h3>capabilities<\/h3><ul><li><section><h3>id<\/h3><p>PS-1<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>Delivers 600W pure sine wave AC output, suitable for powering small home appliances and sensitive electronic devices, minimizing the risk of damage from dirty power.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>PS-2<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>Utilises Lithium Iron Phosphate (LiFePO4) battery cells, known for thermal stability and a cycle life that exceeds standard ternary lithium batteries.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>PS-3<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>Supports recharging via external solar panels, enabling sustainable energy replenishment in sunny climates typical of Southeast Asia and the Middle East.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>PS-4<\/p><\/section><section><h3>status<\/h3><p>implemented<\/p><\/section><section><h3>text<\/h3><p>Equipped with multiple output interfaces including AC, USB-C, USB-A, and DC car port, allowing simultaneous charging of various devices.<\/p><\/section><\/li><li><section><h3>id<\/h3><p>PS-5<\/p><\/section><section><h3>status<\/h3><p>planned<\/p><\/section><section><h3>text<\/h3><p>Roadmap — planned, not available for demonstration or delivery. Localised user manuals and after-sales support services will be provided through regional partners.<\/p><\/section><\/li><\/ul><\/section><section><h3>evidence<\/h3><ul><li><section><h3>claim<\/h3><p>Pure sine wave output is designed to be compatible with sensitive electronics.<\/p><\/section><section><h3>source<\/h3><p>Product technical specification: PS-1 capability description.<\/p><\/section><\/li><li><section><h3>claim<\/h3><p>LiFePO4 chemistry offers enhanced thermal stability compared to other lithium types.<\/p><\/section><section><h3>source<\/h3><p>Product technical specification: PS-2 capability description.<\/p><\/section><\/li><\/ul><\/section><section><h3>compliance<\/h3><section><h3>data_sovereignty<\/h3><p>This is a consumer hardware product. Data sovereignty regulations such as GDPR or local data laws in Indonesia, Saudi Arabia, and the UAE are generally not expected to apply to the device&#x27;s core function. Any associated mobile app data handling would require separate verification against local regulations.<\/p><\/section><section><h3>market_access<\/h3><p>Medical regulatory requirements are not applicable to this consumer electronics product. Import compliance depends on standard electrical safety and customs regulations in target markets (ID, TH, VN, MY, SA, AE). Specific certifications are not claimed in this demonstration.<\/p><\/section><\/section><section><h3>faq<\/h3><ul><li><section><h3>topic<\/h3><p>deployment<\/p><\/section><section><h3>question<\/h3><p>How is this product distributed?<\/p><\/section><section><h3>answer<\/h3><p>The product is distributed via cross-border e-commerce channels, including Amazon FBA and independent online stores, as well as social commerce platforms.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>data<\/p><\/section><section><h3>question<\/h3><p>Does the power station collect user data?<\/p><\/section><section><h3>answer<\/h3><p>As a standalone power supply unit, the core hardware does not collect personal user data. Any connectivity features would be detailed in the specific model&#x27;s privacy policy.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>certification<\/p><\/section><section><h3>question<\/h3><p>What safety certifications does this product have?<\/p><\/section><section><h3>answer<\/h3><p>Specific certification details (such as UL, CE, or PSE) are not provided in this demonstration sample. Buyers should verify current certification status with the supplier before purchase.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>languages<\/p><\/section><section><h3>question<\/h3><p>Is the user manual available in local languages?<\/p><\/section><section><h3>answer<\/h3><p>Roadmap — planned, not available for demonstration or delivery. Multi-language manuals are planned for future release to support regional users.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>training<\/p><\/section><section><h3>question<\/h3><p>Is training required to use this device?<\/p><\/section><section><h3>answer<\/h3><p>No specialized training is required. The device is designed for consumer use with straightforward plug-and-play operation.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>support<\/p><\/section><section><h3>question<\/h3><p>How is after-sales support handled?<\/p><\/section><section><h3>answer<\/h3><p>Roadmap — planned, not available for demonstration or delivery. After-sales support is planned to be managed by local partners in target regions.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>price<\/p><\/section><section><h3>question<\/h3><p>What is the price of the 600W Power Station?<\/p><\/section><section><h3>answer<\/h3><p>Pricing information is not provided in this demonstration sample. Please contact sales representatives for current market pricing.<\/p><\/section><\/li><li><section><h3>topic<\/h3><p>delivery<\/p><\/section><section><h3>question<\/h3><p>What are the delivery times to Southeast Asia or the Middle East?<\/p><\/section><section><h3>answer<\/h3><p>Specific delivery timelines are not provided in this demonstration sample. Shipping estimates depend on the chosen logistics provider and destination.<\/p><\/section><\/li><\/ul><\/section><section><h3>cta<\/h3><section><h3>label<\/h3><p>Contact Sales Team<\/p><\/section><section><h3>next_step<\/h3><p>Reach out to our sales team for bulk order inquiries and detailed specification sheets.<\/p><\/section><\/section><section><h3>seo<\/h3><section><h3>title<\/h3><p>600W Portable Power Station | Solar Ready &amp; LiFePO4 Battery<\/p><\/section><section><h3>description<\/h3><p>Discover the DEMO-BRAND 600W Portable Power Station. Features pure sine wave output, LiFePO4 battery, and solar charging support. Ideal for outdoor and emergency use.<\/p><\/section><section><h3>keywords<\/h3><ul><li><p>portable power station 600W<\/p><\/li><li><p>LiFePO4 battery generator<\/p><\/li><li><p>solar generator for camping<\/p><\/li><li><p>emergency backup power<\/p><\/li><li><p>pure sine wave inverter<\/p><\/li><\/ul><\/section><\/section><section><h3>notices<\/h3><ul><li><p>Fictional demonstration sample; not a real customer, sale or partnership.<\/p><\/li><\/ul><\/section><\/body><\/html>", "sec": 7}];
