# =========================================================================
# 语种本地化规范（多语言本地化 Agent 的数据源）
# 按 V1B 任务书：en / ar / id / th / vi / ms / ru（东南亚 + 中东 + 俄语区备选）
# ru 同时用于演示 RTL（ar）与 LTR（其余）两类排版方向。
# 删除/新增语种只需改本文件，代码不用动（config_check 会校验引用完整性）。
# =========================================================================

en:
  name: 英语
  native_name: English
  rtl: false
  market_focus: "东南亚/中东 B2B 通用商务语（对应 GLOBAL 规则桶 + 各市场英语物料）"
  politeness: "专业商务英语（B2B），无需敬语系统，但保持克制礼貌"
  localization_notes:
    - "面向东南亚/中东读者的英语：避免美式俚语与体育比喻；用国际商务英语"
    - "数字用千分位分隔；计量单位用公制"
    - "医疗术语用临床通用词（EMR/HIS/clinical decision support），不造词"
    - "英式/美式拼写全书统一（建议英式，更贴近东南亚教育背景）"
    - "不得出现第二人称指责式表达（you/your 指向读者缺陷）"

ar:
  name: 阿拉伯语
  native_name: العربية
  rtl: true
  market_focus: "沙特、阿联酋（GCC）"
  politeness: "现代标准阿拉伯语（MSA）正式体；对机构客户用尊称"
  localization_notes:
    - "RTL 从右到左排版：文案中不要内嵌 LTR 破折号序列；品牌名/产品型号可保留拉丁文"
    - "必须使用现代标准阿拉伯语（MSA），禁止方言（埃及/海湾方言都不行）"
    - "宗教与文化禁忌：不当引用宗教符号/经文做营销；斋月期间的营销语境需谨慎"
    - "医疗内容避免展示过多裸露身体部位；女性形象使用需符合当地规范"
    - "数字可用东阿拉伯数字（٠١٢٣٤٥٦٧٨٩）或西阿拉伯数字，单篇内必须统一"
    - "沙特/阿联酋 B2B 语境重视头衔与机构全称"

id:
  name: 印尼语
  native_name: Bahasa Indonesia
  rtl: false
  market_focus: "印度尼西亚"
  politeness: "正式但温暖；机构客户用 Bapak/Ibu 称谓"
  localization_notes:
    - "必须用印尼语（Bahasa Indonesia），不是马来语（Bahasa Melayu）——用词与拼写有系统差异"
    - "体现 izin edar（流通许可）合规意识：物料提及'须与注册许可范围一致'"
    - "技术术语可保留英语借词（如 server、on-premise 在印尼商务语境通用），但句子骨架必须印尼语"
    - "印尼 B2B 语境重视共同体（kebersamaan）与信任背书"

th:
  name: 泰语
  native_name: ภาษาไทย
  rtl: false
  market_focus: "泰国"
  politeness: "泰语敬语粒子体系；品牌官方账号统一用女性礼貌粒子ค่ะ或中性表述，全文一致"
  localization_notes:
    - "敬语：句尾礼貌粒子（ครับ/ค่ะ）必须统一口径；对机构尊称前缀（คุณ/ท่าน）分场合"
    - "绝对红线：严禁任何涉及王室的比喻、玩笑或图像引用（泰国刑法 112 条）"
    - "佛教文化尊重：不得借用佛教元素做商业噱头"
    - "医疗广告在泰国受 TFDA 监管，涉及疗效的表述必须保守"
    - "泰语无空格分词：平台字数限制按字符数计（配置统一用 char 单位）"
    - "数字用西阿拉伯数字；货币如需出现用泰铢（฿）"

vi:
  name: 越南语
  native_name: Tiếng Việt
  rtl: false
  market_focus: "越南"
  politeness: "B2B 用正式称谓（Quý khách / Quý công ty）"
  localization_notes:
    - "声调符号必须完整正确：thiết bị 不能写成 thiet bi；Đ/d 是两个不同字母"
    - "统一用标准北方音术语（河内标准），避免南方用语混写"
    - "B2B 称谓与敬语分层：Quý khách（贵客户）/ Quý công ty（贵公司）"
    - "医疗术语遵循越南卫生部（MOH）公布的标准译名"
    - "越南读者对诚实营销敏感：夸大表述容易被举报"

ms:
  name: 马来语
  native_name: Bahasa Melayu
  rtl: false
  market_focus: "马来西亚（+文莱）"
  politeness: "正式马来语；称谓 Encik/Puan/Tuan"
  localization_notes:
    - "马来西亚市场用 Bahasa Melayu；与印尼语的差异需尊重（近形词义差）"
    - "正式文案中避免 Bahasa rojak（马来语-英语混杂），但行业通用英语术语可保留"
    - "宗教中庸原则：避免猪肉/酒精等相关联想；斋月语境谨慎"
    - "医疗广告需体现 MDA（马来西亚医疗器械管理局）注册意识"
    - "称谓：男性 Encik、女性 Puan；机构用 Tuan"

ru:
  name: 俄语
  native_name: Русский
  rtl: false
  market_focus: "俄语区（俄罗斯/哈萨克斯坦/白俄罗斯——备选市场）"
  politeness: "正式商务俄语，统一用 Вы（尊称）形式，禁用 ты"
  localization_notes:
    - "正式公文文体（официально-деловой стиль）：完整句、避免口语缩略"
    - "医疗术语遵循俄罗斯卫生部标准术语；ИИ（人工智能）等缩写首次出现给全称"
    - "数字千分位用空格（1 000）；单位用公制"
    - "避免政治隐喻与苏联怀旧梗；不使用战争相关比喻"
    - "B2B 语境重视完整机构名称与法律实体表述"
