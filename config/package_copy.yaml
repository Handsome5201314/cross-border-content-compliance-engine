medical_notice:
  en: AI outputs are drafts and require physician review before use.
  ar: مخرجات الذكاء الاصطناعي مسودات وتتطلب مراجعة الطبيب قبل الاستخدام.
  id: Keluaran AI adalah draf dan harus ditinjau dokter sebelum digunakan.
  th: ผลลัพธ์จาก AI เป็นฉบับร่างและต้องได้รับการตรวจทานโดยแพทย์ก่อนใช้งาน
  vi: Đầu ra AI là bản nháp và cần được bác sĩ xem xét trước khi sử dụng.
  ms: Output AI ialah draf dan memerlukan semakan doktor sebelum digunakan.
demo_notice:
  en: Fictional demonstration sample; not a real customer, sale or partnership.
  ar: نموذج توضيحي خيالي؛ لا يمثل عميلاً أو مبيعات أو شراكة حقيقية.
  id: Sampel demonstrasi fiktif; bukan pelanggan, penjualan, atau kemitraan nyata.
  th: ตัวอย่างสาธิตสมมติ ไม่ใช่ลูกค้า ยอดขาย หรือความร่วมมือจริง
  vi: Mẫu minh họa hư cấu; không phải khách hàng, doanh số hay đối tác thực tế.
  ms: Sampel demonstrasi rekaan; bukan pelanggan, jualan atau perkongsian sebenar.
roadmap:
  en: Roadmap — planned, not available for demonstration or delivery.
  ar: خارطة الطريق — مخطط له، غير متاح للعرض العملي أو التسليم.
  id: Roadmap — direncanakan, belum tersedia untuk demonstrasi atau pengiriman.
  th: แผนงานในอนาคต ยังไม่พร้อมสาธิตหรือส่งมอบ
  vi: Lộ trình dự kiến — chưa có để trình diễn hoặc bàn giao.
  ms: Pelan masa hadapan — belum tersedia untuk demonstrasi atau penghantaran.
