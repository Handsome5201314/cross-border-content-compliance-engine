  ar: [SA, AE]
  id: [ID]
  th: [TH]
  vi: [VN]
  ms: [MY]
  ru: [RU]

# ---------- 合规等级 ----------
levels:
  strict:
    name: 严格（默认，推荐）
    description: "全量规则：全局红线信号 + 目标市场规则 + 免责声明强制追加并校验非空 + 双层审查全开"
    append_disclaimer: true
    require_disclaimer: true
  standard:
    name: 标准
    description: "全局红线 + 目标市场规则，免责声明追加（不强制校验非空）"
    append_disclaimer: true
    require_disclaimer: false
  loose:
    name: 宽松（内部草稿用）
    description: "仅全局红线信号 + LLM 快扫，不追加免责声明"
    append_disclaimer: false
    require_disclaimer: false

