# =========================================================================
# 医疗广告合规规则库（合规审查 Agent 的数据源）
# 双层审查 = 本地正则规则引擎（待审信号）+ LLM 语义裁决（跨厂商模型）
#
# 重要口径（对应评审 P1-12 / P1-11）：
# 1. 正则命中一律是「待审信号」（mode: signal），不是确定违规；否定语境
#    （Not a cure / do not guarantee / 不保证治愈）由语义层裁决为 benign 并保留原文；
#    未获裁决的信号按违规保守处理（fail-closed）；
# 2. 本规则库为比赛 Demo 用途的工程化整理，未联网核验各国法规原文，
#    不构成法律意见；正式商用需以各国监管原文为准；
# 3. 每个市场输出 广告规则 + 准入待核(access_notes) + 数据主权待核
#    (data_sovereignty_notes)；未知不视为通过。
# =========================================================================

meta:
  version: "3.0"
  legal_notice: "本合规输出为工程化规则与模型辅助判断，不构成法律意见。"
  evidence_status: "规则为 Demo 用途的工程化整理，未联网核验监管原文；认证/准入/数据主权事项均为待核清单。"

# ---------- 全局红线（跨市场通用；命中=待审信号） ----------
global_rules:
  mode: signal
  forbidden_patterns:
    # 绝对化用语（英文）
    - {pattern: '\b(?:best|No\.?\s*1|number\s*one|world.s\s+(?:best|leading)|top\s+rated|most\s+advanced)\b', severity: high, reason: 疑似绝对化用语（医疗广告普遍禁止，待语义层裁决语境）}
    # 疗效承诺（英文）
    - {pattern: '\b(?:cure[sd]?|heals?|treats?\s+all|miracle|revolutionary)\b', severity: high, reason: 疑似疗效承诺/夸大宣传（否定语境由语义层裁决）}
    # 绝对安全/保证承诺——已修 100% 词边界漏报（P1-12：不再要求 % 后还有词边界）
    - {pattern: '\b100\s*%', severity: high, reason: 疑似百分比绝对化宣称（如 100% safe/effective）}
    - {pattern: '\b(?:guarantee[sd]?|guaranteed\s+results?|completely\s+safe|risk[-\s]?free|no\s+side\s+effects?|zero\s+risk)\b', severity: high, reason: 疑似保证承诺/绝对安全宣称（否定语境由语义层裁决）}
    # 认证声明（无证据不得出现）
    - {pattern: '\b(?:FDA\s+approved|CE\s+certified|WHO\s+approved|NMPA\s+approved|SFDA\s+approved|BPOM\s+approved|ISO\s*13485\s+certified)\b', severity: high, reason: 认证声明必须有证书证据；本产品资料未提供认证信息，一律不得出现}
    - {pattern: '\b(?:cheapest|lowest\s+price|free\s+trial\s+forever)\b', severity: medium, reason: 最低价/无限免费承诺}
    # 中文源文案风险
    - {pattern: '治愈|根治|包治|百分百|百分之百|全球第一|最先进|保证有效|无副作用|彻底治好|药到病除', severity: high, reason: 中文绝对化/疗效承诺用语}
    # 俄语（新覆盖语种）
    # 已知瑕疵（2026-09-09，暂不修）：本行含通用模式 100\s*%，导致阿语/印尼语文案命中时
    # 审计标签误显示「俄语」。判定结果不受影响（真正拍板的是语义层 verdict/reason）。
    # 修复需改动 pattern 集合 → 触发 verify_deep_outputs 的「规则与快照不一致」而全红，
    # 且重跑 ar/id 有丢失「100% 双判」演示案例的风险。故保留，待赛后处理。
    - {pattern: '(?:гарантир\w+|100\s*%|излеч\w+|полностью\s+безопасн\w+|без\s+побочн\w+|чудо[-\s]?\w*\s+средство)', severity: high, reason: 俄语保证承诺/疗效宣称（否定语境由语义层裁决）}
    # 印尼语
    - {pattern: 'sembuh\s+total|dijamin\s+sembuh|100\s*%\s*aman', severity: high, reason: 印尼语疗效承诺}
    # 泰语
    - {pattern: 'หายขาด|รักษาได้\s*100|รับประกันผล', severity: high, reason: 泰语疗效承诺}
    # 越南语（声调符号须保留）
    - {pattern: 'chữa\s+khỏi|chữa\s+dứt\s+điểm|an\s+toàn\s+tuyệt\s+đối|đảm\s+bảo\s+100', severity: high, reason: 越南语疗效承诺}
    # 马来语
    - {pattern: 'sembuh\s+sepenuhnya|dijamin\s+selamat\s+100', severity: high, reason: 马来语疗效承诺}
    # 阿拉伯语
    - {pattern: 'الشفاء|علاج\s*نهائي|مضمون\s*المفعول', severity: high, reason: 阿拉伯语疗效承诺}
    # 结构性风险
    - {pattern: '\bdoctor\s+(?:recommended|approved)\b', severity: medium, reason: 医生推荐类背书需实名与授权（多数市场限制）}
    - {pattern: '\bpatients?\s+(?:love|report|experienced)\b', severity: medium, reason: 患者证言类表述在医疗广告中受限}
  # 正反例（_verify_all.py 逐条回归，P1-12）
  test_cases:
    - {text: "100% safe", expect_hit: true, note: 修掉词边界漏报后的必中用例}
    - {text: "100%effective", expect_hit: true}
    - {text: "It is not a cure for any disease", expect_hit: true, adjudication: benign, note: 否定语境——信号命中但应判 benign 并保留}
    - {text: "We do not guarantee results", expect_hit: true, adjudication: benign, note: 否定语境同上}
    - {text: "AI assistant supports clinical documentation", expect_hit: false, note: 干净文案}
  b2b_clarification: "本产品为 B2B 医疗器械软件+硬件（卖给医院/经销商），非面向患者直销（DTC）；DTC 限制条款不直接适用，但医疗广告基础红线仍适用。"

# ---------- 免责声明（按语种；确定性配置，由流水线追加，不经模型手，P1-10） ----------
# 内容三要素：AI 输出为草稿须医生审核；能力以注册范围为准；面向专业/机构受众
disclaimers:
  en: "AI-generated content is a draft and must be reviewed and approved by a physician before use. Product capabilities are limited to the scope of regulatory registration. Intended for healthcare professionals and institutional buyers."
  ar: "المحتوى الذي ينشئه الذكاء الاصطناعي مسودة ويتطلب مراجعة الطبيب واعتماده قبل الاستخدام. قدرات المنتج محدودة بنطاق التسجيل التنظيمي. موجه للمهنيين الصحيين والمشترين المؤسسيين."
  id: "Konten yang dihasilkan AI adalah draf dan harus ditinjau serta disetujui dokter sebelum digunakan. Kemampuan produk terbatas pada lingkup registrasi regulasi. Ditujukan untuk tenaga kesehatan profesional dan pembeli institusi."
  th: "เนื้อหาที่สร้างโดย AI เป็นฉบับร่างและต้องได้รับการตรวจทานและอนุมัติโดยแพทย์ก่อนใช้งาน ความสามารถของผลิตภัณฑ์อยู่ในขอบเขตการจดทะเบียนตามกฎระเบียบ ออกแบบมาสำหรับบุคลากรทางการแพทย์และผู้ซื้อสถาบัน"
  vi: "Nội dung do AI tạo ra là bản dự thảo và phải được bác sĩ xem xét, phê duyệt trước khi sử dụng. Năng lực sản phẩm giới hạn trong phạm vi đăng ký quy định. Dành cho chuyên gia y tế và người mua tổ chức."
  ms: "Kandungan yang dihasilkan AI adalah draf dan mesti disemak serta diluluskan oleh doktor sebelum digunakan. Keupayaan produk terhad kepada skop pendaftaran kawal selia. Untuk profesional penjagaan kesihatan dan pembeli institusi."
  ru: "Материалы, созданные ИИ, являются черновиком и требуют проверки и одобрения врача перед использованием. Возможности продукта ограничены объёмом регистрационного удостоверения. Предназначено для медицинских работников и институциональных покупателей."

